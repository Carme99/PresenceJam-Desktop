name: Feature Request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request

        Got an idea for a new feature? Fill this out and let's talk about it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature (1-2 sentences)
      placeholder: "e.g. Add support for Last.fm scrobbling"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority / Impact
      description: "Helps with planning and prioritization"
      options:
        - Critical — blocks core functionality
        - Important — significant improvement
        - Nice-to-have — enhancement, not urgent

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "What problem does this solve? Why do you want this?"
      placeholder: "e.g. I want to show what I'm listening to on Last.fm as well as Teams status"

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: "How would you like it to work?"
      placeholder: "e.g. Add a Last.fm section in Settings with OAuth flow and scrobbling toggle"

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any alternatives you've considered?"
      placeholder: "e.g. I tried using another app but it doesn't integrate with Teams"

  - type: checkboxes
    id: area
    attributes:
      label: Areas
      description: "Which parts of the app does this relate to? Select all that apply."
      options:
        - label: Spotify integration
        - label: Teams integration
        - label: UI / UX
        - label: System tray
        - label: Settings / Config
        - label: Logging / Diagnostics
        - label: Multiple areas / Cross-cutting
        - label: Other

  - type: textarea
    id: mockups
    attributes:
      label: Screenshots / Mockups
      description: "Optional — mockups or sketches help visualize the idea"
      placeholder: |
        [PLACEHOLDER: Add screenshot or mockup here if applicable]
        Drag and drop or paste image here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Anything else that might help (use case, priority reasoning, etc.)"
      placeholder: "e.g. This would be a nice-to-have but not urgent"
