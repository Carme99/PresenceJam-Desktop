name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow only checks out the PR head and runs builds.
# No secrets required.
permissions:
  contents: read

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform compile+test gate (issues #355, #836): the `rust` job
  # below checks + tests Linux only; this leg runs `cargo check` AND
  # `cargo test` on macOS + Windows so platform-gated code (e.g. tray.rs
  # macOS dock-badge cfg, cfg(windows) CLI attach) both compiles and passes
  # in CI. A regression inside #[cfg(target_os = "macos")] or
  # #[cfg(windows)] fails this leg by construction. Linux-path-only or
  # secret-service-assuming tests must be #[cfg(target_os = ...)] gated,
  # not deleted.
  rust-platform-check:
    name: Rust check + test (macOS + Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo check (all targets)
        env:
          CARGO_INCREMENTAL: 0
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # Runs the Rust unit-test suite on the macOS leg (issue #836).
      # Windows-only: the lib test binary aborts at startup on the
      # windows-latest runner (STATUS_ENTRYPOINT_NOT_FOUND from a system-DLL
      # import, before any test executes — same binary passes check +
      # clippy), so executing tests there is not possible on this image.
      # Windows keeps the `cargo check` compile gate above (which is what
      # catches cfg(windows) breakage); macOS executes the suite. Re-expand
      # to both legs once the runner image links the binary cleanly.
      - name: Cargo test (macOS, issue #836)
        if: matrix.os == 'macos-latest'
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  # Windows CLI smoke (issue #818): the release build is a GUI-subsystem
  # executable (`windows_subsystem = "windows"` in main.rs), so the
  # `--help` / `--status` / `--sync-once` output used to vanish when run
  # from a console. `lib.rs::attach_parent_console_for_cli` re-attaches
  # to the invoking console before any CLI arm prints; this job builds
  # the real release binary (the compile gate for the `cfg(windows)`
  # code), guards the piped CLI surface via `cmd /c --help`, and runs
  # the source-shape regression test below as the fails-pre-fix gate.
  windows-cli-smoke:
    name: Windows CLI smoke (--help prints)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # A debug build keeps a console, so only a release build exercises
      # the attach: `cargo build --release` honours the
      # `windows_subsystem = "windows"` attr that `cargo check` ignores.
      # The exe is `presence-jam.exe` (the Cargo package name); the
      # `PresenceJam` product name only appears in bundle artefacts.
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: 0
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # `cmd /c` is the point, not the shell: a GUI-subsystem exe returns
      # to the prompt immediately, so the file is polled (up to ~30 s)
      # instead of read once — a single read races the child on a slow
      # runner and flakes even with the fix in place.
      #
      # Honest scope note: with stdout redirected to a file the OS hands
      # the child a valid handle, so this file assert passes with or
      # without the attach — it is a CLI-surface guard (piped output must
      # stay intact; the attach early-returns on valid handles). The
      # interactive-console failure (empty screen from `cmd /c`) cannot be
      # reproduced with piped CI stdio. The fails-pre-fix gate is the
      # regression test in the next step, which fails when the helper or
      # its `run()` call is removed; the release build above is the
      # compile gate for the `cfg(windows)` code itself.
      - name: Smoke --help through cmd /c
        shell: cmd
        run: |
          cmd /c "src-tauri\target\release\presence-jam.exe --help > %TEMP%\pj-help.txt"
          set TRIES=0
          :POLL
          for %%A in (%TEMP%\pj-help.txt) do set SIZE=%%~zA
          if not "%SIZE%"=="0" goto CHECKED
          set /a TRIES+=1
          if "%TRIES%"=="30" goto CHECKED
          timeout /t 1 /nobreak >NUL
          goto POLL
          :CHECKED
          if "%SIZE%"=="0" (echo "::error::--help printed nothing (issue #818)" & exit /b 1)
          findstr /c:"--sync-once" %TEMP%\pj-help.txt >NUL || (echo "::error::--help output missing --sync-once" & exit /b 1)

      # Fails pre-fix: the `test_windows_cli_…` source-shape guard fails
      # when `attach_parent_console_for_cli` or its `run()` call is
      # removed. `--release` reuses the build above, so this is cheap.
      - name: Regression test (fails pre-fix)
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib test_windows_cli_attaches_parent_console_before_output

  # Frontend: catches Svelte/TS build errors. Mirrors the npm ci + npm run build
  # steps from release.yml. Cached via actions/setup-node cache: 'npm'.
  # Also runs `cargo test --lib` to materialise the ts-rs `#[ts(export)]`
  # generated .ts files into src/lib/types-generated/ BEFORE
  # `npm run check` (the re-exports in src/lib/types.ts depend on them).
  # This is a no-op for projects not using ts-rs. See #78.
  frontend:
    name: Frontend (npm build + ts-rs codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Build frontend
        run: npm run build

      # ts-rs's `#[ts(export)]` derive writes the generated .ts files
      # into src/lib/types-generated/ when the test binary runs. The
      # `npm run check` step below depends on those files existing
      # (src/lib/types.ts re-exports from them). The test suite also
      # serves as a sanity check that the Rust types round-trip
      # cleanly. For projects not using ts-rs, this is a no-op
      # build of the test binary. See #78.
      - name: Cargo test (lib) to materialise ts-rs codegen
        env:
          CARGO_INCREMENTAL: 0
        # Clear any stale generated files from a previous CI cache.
        # Without this, ts-rs sees the source hasn't changed (cargo
        # incremental cache) and skips re-running the export tests,
        # leaving an outdated AppConfig.ts that doesn't re-export
        # the inner config types. See #78.
        run: |
          rm -rf src/lib/types-generated/
          mkdir -p src/lib/types-generated/
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Type-check Svelte/TS via svelte-check. Runs after Build frontend
      # and the cargo test step above so the generated $types,
      # .svelte-kit output, and src/lib/types-generated/ files are
      # all in place.
      - name: Svelte/TS type check (npm run check)
        run: npm run check

      # Frontend unit tests + the coverage RATCHET via vitest (issues #443,
      # #681). Runs after the type check. Deliberately not `--if-present`
      # (issue #607): a missing or renamed script must fail this leg, not let
      # it report green with zero tests executed.
      #
      # The coverage variant is the gate, not `npm test`: the four thresholds
      # in vitest.config.js are the values measured on the merged tree, and
      # vitest exits non-zero when any of them is missed, so a change that
      # drops coverage fails this job exactly like a failing test does. No
      # `continue-on-error` — a ratchet that cannot fail the job is not one.
      - name: Frontend unit tests + coverage ratchet (npm run test:coverage)
        run: npm run test:coverage

      # Playwright exercises the real log-column geometry in a Chromium
      # browser, complementing (not replacing) the Vitest coverage ratchet.
      - name: Browser geometry regression (npm run test:browser)
        run: npm run test:browser

  # Rust: cargo check + cargo test on all targets (lib + bins + tests + benches) catches
  # type errors, borrow errors, missing imports, and broken test code.
  # Runs cargo check + cargo test + clippy (clippy in separate job).
  # Frontend build is required because src-tauri/src/lib.rs uses
  # tauri::generate_context!() which embeds build/ via include_dir! at
  # compile time, even during cargo check.
  # Tauri on Linux pulls in glib-sys/webkit2gtk-sys/etc. via FFI bindings,
  # so the runner needs the GTK + webkit2gtk system headers and pkg-config
  # to satisfy the build scripts. release.yml doesn't need this because
  # it only builds on macOS/Windows — no Linux job there.
  rust:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96
        with:
          components: rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # rustfmt is stated policy in CONTRIBUTING.md and CLAUDE.md, but
      # clippy does not deny rustfmt diffs, so it needs its own gate.
      # Fast (~2s); the rustfmt component comes from Setup Rust above
      # (dtolnay/rust-toolchain installs the minimal profile by default).
      - name: Cargo fmt (check)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Cargo check (all targets)
        env:
          CARGO_INCREMENTAL: 0
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # Runs the Rust unit-test suite. `cargo check` above only emits
      # metadata (.rmeta); `cargo test` needs codegen'd rlib/bin artifacts,
      # so this is a second full compile of the dependency tree, not an
      # incremental reuse — a Cargo.lock change (every backend Dependabot
      # merge, weekly) makes both passes cold. That is why this job gets
      # 25 minutes while the macOS/Windows leg (check + test, issue #836)
      # gets 45.

      - name: Cargo test (all targets)
        env:
          CARGO_INCREMENTAL: 0
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  # Clippy: same scope as cargo check but with lint enforcement.
  # Treats warnings as errors so noisy/deprecated lints can't sneak in.
  # Same frontend build dependency as the rust job.
  # Tauri on Linux pulls in glib-sys/webkit2gtk-sys/etc. via FFI bindings,
  # so the runner needs the GTK + webkit2gtk system headers and pkg-config
  # to satisfy the build scripts. release.yml doesn't need this because
  # it only builds on macOS/Windows — no Linux job there.
  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo clippy (deny warnings)
        env:
          CARGO_INCREMENTAL: 0
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # CHANGELOG: every `## [X]` section header must have a matching `[X]:`
  # link definition at the bottom of the file, otherwise the version link
  # renders dead (see #437, #438). Fails the run on the first missing def.
  changelog-links:
    name: CHANGELOG link definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check CHANGELOG headers have link definitions
        run: |
          missing=0
          # A cut must not drop the bucket contributors write into (#835).
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "MISSING [Unreleased] section"
            missing=1
          fi
          for v in $(grep -oE '^## \[[^]]+\]' CHANGELOG.md | grep -oE '\[[^]]+\]' | tr -d '[]'); do
            if ! grep -q "^\[$v\]:" CHANGELOG.md; then
              echo "MISSING link definition for [$v]"
              missing=1
            fi
          done
          exit $missing

  # Version consistency (issue #605): the release tag decides the version
  # written into latest.json, while the shipped binary self-reports
  # whatever tauri.conf.json says (Cargo.toml and package.json are two more
  # copies). A partial bump ships a binary whose self-reported version never
  # matches latest.json, so tauri-plugin-updater re-offers the same update
  # on every check and the prompt never goes away. release.yml gates the
  # tag against all three sources; this leg catches the drift at PR time,
  # before a tag exists to disagree with.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the three version sources agree
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          PKG_VERSION=$(jq -r .version package.json)
          CARGO_VERSION=$(sed -nE 's/^version = "(.*)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "src-tauri/tauri.conf.json : ${CONFIG_VERSION}"
          echo "package.json              : ${PKG_VERSION}"
          echo "src-tauri/Cargo.toml      : ${CARGO_VERSION}"
          drift=0
          for entry in "package.json:${PKG_VERSION}" "src-tauri/Cargo.toml:${CARGO_VERSION}"; do
            file="${entry%:*}"
            version="${entry##*:}"
            if [ "$version" != "$CONFIG_VERSION" ]; then
              echo "::error::version drift: ${file} says '${version}' but src-tauri/tauri.conf.json says '${CONFIG_VERSION}'"
              drift=1
            fi
          done
          exit "$drift"

  # Secret scan (issue #356): read-only gitleaks detect over all commits.
  # No SARIF upload (needs security-events:write); findings surface as
  # step output. contents:read is already the workflow default.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks detect
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency-vulnerability gate (issue #357): surfaces new advisories on
  # the introducing PR. The cargo leg stays advisory (`continue-on-error`
  # scoped to that step) until the two accepted quick-xml
  # RUSTSEC-2026-0194/-0195 advisories clear upstream (see SECURITY.md
  # "Accepted transitive risks", issue #642); then drop the ignore IDs and
  # the step-level flag to enforce. The npm leg gates on production
  # advisories (`--omit=dev`); the full-tree run below stays advisory-only.
  dep-audit:
    name: Dependency audit (cargo + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cargo audit (advisory)
        uses: RustSec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Owner: maintainer; expiry: first release where `cargo audit`
          # shows both advisories cleared upstream (issue #642). Accepted
          # transitive risks, see SECURITY.md "Accepted transitive risks".
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      # Gating leg: a deliberately-vulnerable production dep fails this step
      # (--omit=dev keeps dev-only advisories from blocking). Non-zero exit
      # fails the job.
      - name: npm audit (production, gating)
        run: |
          npm audit --omit=dev --audit-level=high

      # Advisory leg: full-tree output stays non-blocking so dev-only
      # findings (e.g. the devalue moderate, issue #357) surface without
      # gating. `run` is a block scalar on purpose: a plain scalar cannot
      # contain " #", so the `#357` reference used to end the YAML value
      # early ("unexpected EOF while looking for matching \"" — the npm leg
      # never ran at all). Keep the value on its own line if citing an issue.
      - name: npm audit (full tree, advisory)
        continue-on-error: true
        run: |
          npm audit --audit-level=high

  # No vendored binaries (issue #753): render tooling (chrome-headless-shell
  # via mmdc) downloads into the repo root; it must stay gitignored so it
  # never lands in git status or a commit. Read-only check: fails when a
  # root-level path is both untracked and unignored.
  no-vendored-binaries:
    name: No vendored binaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on untracked, unignored root paths
        run: |
          set -euo pipefail
          stray=$(git status --porcelain | grep -E '^\?\? [^/]*/?$' || true)
          if [ -n "$stray" ]; then
            echo "::error::untracked, unignored root paths present — vendored binaries must be gitignored (see issue #753):"
            echo "$stray"
            exit 1
          fi

  # License + source gate (issue #776): `dep-audit` covers advisories only, so
  # a new dependency with an incompatible license (or a git/non-crates.io
  # source) changes what the project ships with no CI signal. `licenses` +
  # `sources` fail the run; `bans` stays warn-only in deny.toml (duplicate
  # versions are endemic to this tree) so it is not part of this command.
  cargo-deny:
    name: Cargo deny (licenses + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cargo deny (licenses + sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          command-arguments: licenses sources

  # Rust line-coverage gate (issue #838): publishes lcov + enforces a line
  # floor so new untested code cannot slip in silently. The floor and the
  # per-file floors below are 0 with a calibration TODO because the floor
  # must be measured on the merged head (running coverage in a parallel
  # worktree would measure the wrong tree). Calibrate in the PR body.
  rust-coverage:
    name: Rust coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73  # v2.87.17
        with:
          tool: cargo-llvm-cov

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # TODO(#838): calibrate floor to the exact line coverage measured on
      # the merged head (see PR body). Floor is 0 until then so the job
      # publishes the report without gating.
      - name: Coverage (fail under floor once calibrated)
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib \
            --fail-under-lines 0 --lcov --output-path lcov.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rust-lcov
          path: lcov.info

      # Structural per-file floors: deleting e.g. the token_io.rs tests
      # lowers that file's number and fails this step once calibrated.
      # TODO(#838): calibrate each floor to the merged-head measurement
      # (see PR body). Floors are 0 until then (report-only).
      - name: Per-file floors (poll_once, config, token_io)
        run: |
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --json \
            | jq -e '
              def floor(name; want):
                ([.data[0].files[] | select(.filename | endswith(name))]
                 | if length == 0 then "missing file: \(name)" | halt_error(1)
                   else .[0].summary.lines.percent
                   end) as $pct
                | if $pct < want then
                    "below floor: \(name) \($pct)% < \(want)%" | halt_error(1)
                  else ("ok: \(name) \($pct)% >= \(want)%" | stderr | true)
                  end;
              floor("polling/poll_once.rs"; 0),
              floor("config.rs"; 0),
              floor("token_io.rs"; 0)
            ' > /dev/null

  # Docs links (issue #831): stdlib-only `docs/link-audit.py` checks every
  # relative markdown link target exists on disk and every `#anchor`
  # resolves against the target file's headings (incl. explicit
  # `<a name>`/`<a id>` anchors). No npm ci/node — plain python3.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Audit relative markdown links
        run: python3 docs/link-audit.py
