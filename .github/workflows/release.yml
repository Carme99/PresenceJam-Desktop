name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: PresenceJam-${{ github.ref_name }}-macos.dmg
            bundle_path: |
              PresenceJam-macos.dmg
              PresenceJam-${{ github.ref_name }}.app.tar.gz
              PresenceJam-${{ github.ref_name }}.app.tar.gz.sig
          - os: windows-latest
            target: ''
            artifact_name: PresenceJam-${{ github.ref_name }}.msi
            bundle_path: |
              src-tauri/target/release/bundle/msi/*.msi
              PresenceJam-${{ github.ref_name }}.msi.sig
          - os: ubuntu-22.04
            target: ''
            artifact_name: PresenceJam-${{ github.ref_name }}-linux-amd64
            bundle_path: |
              PresenceJam-linux-amd64.deb
              PresenceJam-linux-amd64.AppImage
              PresenceJam-${{ github.ref_name }}.AppImage.sig

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # stable

      # Cargo cache mirrors the PR-time ci.yml setup (PR #55). Cuts the
      # release build from ~50 min cold compile to ~15-20 min warm.
      # First release on a fresh runner is still cold; subsequent
      # tag pushes benefit.
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      # Tauri on Linux pulls in glib-sys/webkit2gtk-sys/etc. via FFI
      # bindings, so the Ubuntu runner needs the GTK + webkit2gtk system
      # headers and pkg-config. Mirrors the pr-time ci.yml setup. The
      # Linux build produces both .deb (Debian package) and .AppImage
      # (universal single-file binary) in one `tauri build` invocation.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Build Tauri (Linux)
        if: matrix.os == 'ubuntu-22.04'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Debug macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Bundle directory structure ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No files found"
          echo "=== DMG files ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null || echo "No dmg found"

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          dmg_path=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
          echo "Found dmg: $dmg_path"
          cp "$dmg_path" "PresenceJam-macos.dmg"

      # The updater plugin consumes the signed .app.tar.gz (+ .sig) from
      # the bundle; copy them to the deterministic release names so the
      # latest.json URLs are stable across versions.
      - name: Package macOS updater artifacts
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          TARGZ=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -1)
          SIG="${TARGZ}.sig"
          if [ -z "$TARGZ" ] || [ ! -f "$SIG" ]; then
            echo "::error::Expected .app.tar.gz and .sig in bundle/macos/"
            ls -la src-tauri/target/${{ matrix.target }}/release/bundle/macos/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$TARGZ" "PresenceJam-${{ github.ref_name }}.app.tar.gz"
          cp "$SIG" "PresenceJam-${{ github.ref_name }}.app.tar.gz.sig"
          echo "Packaged updater artifacts:"
          ls -la PresenceJam-${{ github.ref_name }}.app.tar.gz*

      - name: Rename Windows MSI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "PresenceJam-${{ github.ref_name }}.msi"

      # The MSI itself is the updater artifact; ship its .sig alongside
      # under the deterministic release name (the .msi is already renamed
      # above and uploaded via bundle_path).
      - name: Package Windows updater signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sig = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi.sig" | Select-Object -First 1
          if (-not $sig) {
            Write-Error "Expected .msi.sig in bundle/msi/"
            exit 1
          }
          Copy-Item $sig.FullName "PresenceJam-${{ github.ref_name }}.msi.sig"
          Get-ChildItem "PresenceJam-${{ github.ref_name }}.msi.sig"

      # Linux artifacts are named like `presence-jam_2.7.2_amd64.deb` by
      # Tauri's bundler. Rename to the project-standard format used by
      # the macOS and Windows steps (PresenceJam-<version>-<os>.ext) and
      # drop the .AppImage alongside.
      - name: Package Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$DEB" ] || [ -z "$APPIMAGE" ]; then
            echo "::error::Expected one .deb in bundle/deb/ and one .AppImage in bundle/appimage/"
            echo "bundle/deb/:"
            ls -la src-tauri/target/release/bundle/deb/ 2>&1 || echo "(missing)"
            echo "bundle/appimage/:"
            ls -la src-tauri/target/release/bundle/appimage/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$DEB" "PresenceJam-linux-amd64.deb"
          cp "$APPIMAGE" "PresenceJam-linux-amd64.AppImage"
          APPIMAGE_SIG="${APPIMAGE}.sig"
          if [ ! -f "$APPIMAGE_SIG" ]; then
            echo "::error::Expected .AppImage.sig in bundle/appimage/"
            ls -la src-tauri/target/release/bundle/appimage/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$APPIMAGE_SIG" "PresenceJam-${{ github.ref_name }}.AppImage.sig"
          echo "Packaged:"
          ls -la PresenceJam-linux-amd64.* PresenceJam-${{ github.ref_name }}.AppImage.sig

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          digest-mismatch: warn

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          artifacts: artifacts/**/*
          draft: false
          prerelease: false
          allowUpdates: true
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The updater plugin does no GitHub auto-discovery: it only reads
      # the endpoint configured in tauri.conf.json, so the release must
      # carry a latest.json that maps platform -> signed artifact URL.
      # Signatures are the .sig file CONTENTS (minisign output), not
      # paths; version = tag without the leading v; pub_date is RFC3339.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Downloaded artifacts keep the upload-artifact name as a
          # subdirectory under artifacts/ (download-artifact v4+ layout).
          MAC_SIG="artifacts/PresenceJam-${GITHUB_REF_NAME}-macos.dmg/PresenceJam-${GITHUB_REF_NAME}.app.tar.gz.sig"
          WIN_SIG="artifacts/PresenceJam-${GITHUB_REF_NAME}.msi/PresenceJam-${GITHUB_REF_NAME}.msi.sig"
          LINUX_SIG="artifacts/PresenceJam-${GITHUB_REF_NAME}-linux-amd64/PresenceJam-${GITHUB_REF_NAME}.AppImage.sig"

          for f in "$MAC_SIG" "$WIN_SIG" "$LINUX_SIG"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing updater signature file: $f"
              exit 1
            fi
          done

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${GITHUB_REF_NAME}/PresenceJam-${GITHUB_REF_NAME}.app.tar.gz" \
            --arg mac_sig "$(cat "$MAC_SIG")" \
            --arg win_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${GITHUB_REF_NAME}/PresenceJam-${GITHUB_REF_NAME}.msi" \
            --arg win_sig "$(cat "$WIN_SIG")" \
            --arg linux_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${GITHUB_REF_NAME}/PresenceJam-linux-amd64.AppImage" \
            --arg linux_sig "$(cat "$LINUX_SIG")" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "linux-x86_64": { url: $linux_url, signature: $linux_sig }
              }
            }' > latest.json
          echo "=== latest.json ==="
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Homebrew tap update (carme99/homebrew-tap)
  # ------------------------------------------------------------------
  # Runs after the GitHub Release is published so the DMG is available
  # at a stable URL. Pulls the artifact, computes its SHA256, and
  # updates the presence-jam formula in the tap.
  #
  # Required GitHub Actions secret (must be set in the repo's secrets
  # before the next v* tag push):
  #   HOMEBREW_TAP_TOKEN    classic PAT or fine-grained token with
  #                         contents:write on carme99/homebrew-tap.
  #                         (A fine-grained PAT scoped only to that
  #                         repo is the safer choice.)
  #
  # The job is self-bootstrapping: if presence-jam.rb doesn't exist
  # in the tap yet, it creates it. If it does, it updates version /
  # url / sha256. A no-op if the formula is already at the same
  # version (so re-running the workflow doesn't churn git history).
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Required so the homebrew/presence-jam.rb template is on the
      # runner. The release job already pushed the artifact to the
      # GitHub Release, but the source tree on the runner only
      # contains what was checked out at workflow-start.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: PresenceJam-${{ github.ref_name }}-macos.dmg
          path: dist/
          digest-mismatch: warn

      - name: Compute SHA256 of the DMG
        working-directory: dist
        run: |
          set -euo pipefail
          if [ ! -f PresenceJam-macos.dmg ]; then
            echo "::error::PresenceJam-macos.dmg not found in artifact. Did the macOS build step succeed?"
            exit 1
          fi
          sha256sum PresenceJam-macos.dmg | tee sha256.txt
          echo "Computed SHA256 for ${{ github.ref_name }}"

      - name: Update Homebrew formula in carme99/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN must be set as a repository secret. See PR description for setup steps."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"  # strip leading 'v'
          DMG_URL="https://github.com/Carme99/PresenceJam-Desktop/releases/download/${GITHUB_REF_NAME}/PresenceJam-macos.dmg"
          SHA=$(awk '{print $1}' dist/sha256.txt)
          echo "Updating tap formula to v${VERSION} (sha256=${SHA})"

          # Render the formula from the template in homebrew/presence-jam.rb
          # by substituting the placeholders. The template is checked in
          # so the formula content is reviewable in normal diffs and doesn't
          # live inside the workflow YAML.
          sed -e "s|__URL__|${DMG_URL}|g" \
              -e "s|__SHA256__|${SHA}|g" \
              -e "s|__VERSION__|${VERSION}|g" \
              homebrew/presence-jam.rb > presence-jam.rb.rendered

          # Shallow clone the tap without any credentials, then push via
          # a credential helper that hands the HOMEBREW_TAP_TOKEN to git
          # on demand. The token never appears in `git remote -v` output,
          # command lines, or shell history. Pattern from
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-secrets
          # SECURITY: HOMEBREW_TAP_TOKEN must be a fine-grained PAT scoped ONLY to
          # carme99/homebrew-tap with contents:write. A classic PAT gives full
          # access to every repo under the Carme99 GitHub account.
          # Rotate on a 90-day cadence. See docs: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
          git clone --depth 1 --branch main https://github.com/carme99/homebrew-tap.git tap
          cd tap
          # Configure a non-persistent credential helper that returns the token
          # only for pushes to the tap. The `!` prefix runs the command via
          # `sh -c`, so the token is sourced from the env, not interpolated.
          git config --local credential.helper '!f() { echo username=x-access-token; echo password=${HOMEBREW_TAP_TOKEN}; }; f'
          # Sanity-check the credential helper works before any commit/push.
          git ls-remote --heads origin main >/dev/null

          # If the formula is already at this version, nothing to do.
          if [ -f presence-jam.rb ]; then
            CURRENT_VERSION=$(grep -E '^  version ' presence-jam.rb | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ "${CURRENT_VERSION}" = "${VERSION}" ]; then
              echo "Formula is already at v${VERSION}, no change"
              exit 0
            fi
            echo "Formula currently at v${CURRENT_VERSION}, updating to v${VERSION}"
          else
            echo "Formula does not exist yet, creating it"
          fi

          cp ../presence-jam.rb.rendered presence-jam.rb
          git config user.name "Nova"
          git config user.email "nova@lee-lab.local"
          git add presence-jam.rb
          git commit -m "presence-jam: bump to v${VERSION}"
          git push origin main
          echo "Tap updated: carme99/homebrew-tap presence-jam.rb -> v${VERSION}"

  winget:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The winget-releaser action does not update open PRs — if a PR
      # already exists for this version, it silently skips. This is
      # a footgun: if the manifest becomes stale (e.g. the underlying
      # MSI was re-uploaded with a different filename), the broken
      # PR blocks the package from being re-submitted. The current
      # workaround when this happens: close the open PR, then push
      # a new tag (or force-move the existing tag) to re-fire this
      # job, which sees no open PR and creates a fresh one.
      # SECURITY: WINGET_TOKEN must be a fine-grained PAT scoped ONLY to
      # microsoft/winget-pkgs with contents:write (and pull_requests:write
      # if the action creates PRs against that repo). A classic PAT or
      # broader-scoped token grants unnecessary access to every repo the
      # token owner can reach. Rotate on a 90-day cadence.
      # See docs: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
      - uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e  # v2
        with:
          identifier: PresenceJam.PresenceJam
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ github.ref_name }}
