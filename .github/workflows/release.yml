name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: PresenceJam-${{ github.ref_name }}-macos.dmg
          - os: windows-latest
            target: ''
            artifact_name: PresenceJam-${{ github.ref_name }}.msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CARGO_INCREMENTAL: 0
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_INCREMENTAL: 0
        run: npx tauri build

      # ------------------------------------------------------------------
      # macOS code signing + notarization (issue #54)
      # ------------------------------------------------------------------
      # Required GitHub Actions secrets (must be set before the next
      # v* tag is pushed — see docs/SIGNING_SETUP.md for setup):
      #   APPLE_CERTIFICATE              base64-encoded .p12 Developer ID Application cert
      #   APPLE_CERTIFICATE_PASSWORD     password for the .p12
      #   APPLE_KEYCHAIN_PASSWORD        any random string — locks the temp keychain the
      #                                   workflow creates on the runner (not the .p12 password)
      #   APPLE_SIGNING_IDENTITY         "Developer ID Application: <Name> (<TeamID>)"
      #   APPLE_ID                       Apple ID email (for notarytool)
      #   APPLE_PASSWORD                 app-specific password (appleid.apple.com → App-Specific Passwords)
      #   APPLE_TEAM_ID                  10-char Apple Team ID
      # This step fails the build loudly if any secret is missing or the
      # notarization submission is rejected. Don't publish a release
      # without notarization — Gatekeeper will hard-block the DMG.
      - name: Import Apple Developer ID certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be set as repository secrets before tagging a release. See PR description for setup steps."
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          TMP_P12="$RUNNER_TEMP/cert.p12"
          # `base64 -D` is the BSD form on macOS; GNU `base64` uses `-d`.
          # The macOS runner image uses BSD userland.
          echo -n "$APPLE_CERTIFICATE" | base64 -D > "$TMP_P12"
          security import "$TMP_P12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$TMP_P12"
          echo "Cert imported into $KEYCHAIN_PATH"

      - name: Sign and notarize macOS DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID must be set as repository secrets. See PR description."
            exit 1
          fi
          # Locate the unsigned DMG that tauri build produced.
          # macOS's BSD `find` does not support `-maxdepth`, so use the
          # same plain pattern as the existing "Package macOS artifact"
          # step below.
          DMG_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No DMG found under src-tauri/target/${{ matrix.target }}/release/bundle — did tauri build succeed?"
            exit 1
          fi
          echo "Signing DMG: $DMG_PATH"
          codesign --force --deep --options runtime --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$DMG_PATH"
          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          echo "Signed + notarized: $DMG_PATH"

      - name: Clean up signing keychain
        if: matrix.os == 'macos-latest' && always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security default-keychain -s login.keychain-db
            security list-keychain -d user -s login.keychain-db
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "Removed temp keychain $KEYCHAIN_PATH"
          fi

      - name: Debug macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Bundle directory structure ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No files found"
          echo "=== DMG files ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null || echo "No dmg found"

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          dmg_path=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
          echo "Found dmg: $dmg_path"
          cp "$dmg_path" "PresenceJam-macos.dmg"

      # ------------------------------------------------------------------
      # Windows code signing (issue #54)
      # ------------------------------------------------------------------
      # Required GitHub Actions secrets:
      #   WINDOWS_CERTIFICATE            base64-encoded .pfx code-signing cert
      #   WINDOWS_CERTIFICATE_PASSWORD   password for the .pfx
      # SmartScreen reputation accrues over time on a fresh cert; the
      # first few releases will still warn but eventually quiet down.
      - name: Sign Windows MSI
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Error "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be set as repository secrets. See PR description for setup steps."
            exit 1
          }
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "No MSI found under src-tauri/target/release/bundle/msi"; exit 1 }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Write-Host "Signing $($msi.FullName) with signtool..."
          & signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $msi.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool exited $LASTEXITCODE"; exit $LASTEXITCODE }
          Write-Host "Verifying signature..."
          & signtool verify /pa $msi.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify exited $LASTEXITCODE"; exit $LASTEXITCODE }
          Write-Host "Signed + verified: $($msi.FullName)"
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Rename Windows MSI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "PresenceJam-${{ github.ref_name }}.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.os == 'macos-latest' && 'PresenceJam-macos.dmg' || 'src-tauri/target/release/bundle/msi/*.msi' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/**/*
          draft: false
          prerelease: false
          allowUpdates: true
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: PresenceJam.PresenceJam
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ github.ref_name }}
