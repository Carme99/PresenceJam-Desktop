name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: PresenceJam-${{ github.ref_name }}-macos.dmg
          - os: windows-latest
            target: ''
            artifact_name: PresenceJam-${{ github.ref_name }}.msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CARGO_INCREMENTAL: 0
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_INCREMENTAL: 0
        run: npx tauri build

      - name: Debug macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Bundle directory structure ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No files found"
          echo "=== DMG files ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null || echo "No dmg found"

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          dmg_path=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
          echo "Found dmg: $dmg_path"
          cp "$dmg_path" "PresenceJam-macos.dmg"

      - name: Rename Windows MSI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "PresenceJam-${{ github.ref_name }}.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.os == 'macos-latest' && 'PresenceJam-macos.dmg' || 'src-tauri/target/release/bundle/msi/*.msi' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/**/*
          draft: false
          prerelease: false
          allowUpdates: true
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: PresenceJam.PresenceJam
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ github.ref_name }}
