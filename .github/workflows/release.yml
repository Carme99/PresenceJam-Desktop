name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-cut: lets a maintainer re-run the release for an existing
  # v* tag without force-moving/re-pushing the tag. The 'tag' input is
  # required when dispatching from a non-tag ref; see the resolve-tag job.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re-)cut, e.g. v4.0.0'
        required: false
        default: ''
        type: string

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Tag resolution (supports manual re-cut via workflow_dispatch)
  # ------------------------------------------------------------------
  # Every downstream job consumes this output instead of
  # github.ref_name, so a manual dispatch from a branch resolves to the
  # requested tag while a normal v* tag push keeps today's behaviour.
  # Fails fast if the resolved name is not an existing v* tag.
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::'$TAG' is not a v* tag. Pass an existing tag (e.g. v4.0.0) via the 'tag' input when dispatching manually."
              exit 1
              ;;
          esac
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::Tag ${TAG} does not exist on ${GITHUB_REPOSITORY}"; exit 1; }
          echo "Resolved release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    # Least privilege for the build matrix: read-only repo access plus
    # the OIDC (id-token) and attestations scopes consumed by
    # actions/attest-build-provenance below. The publishing jobs keep
    # the workflow-level contents:write grant.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: PresenceJam-${{ needs.resolve-tag.outputs.tag }}-macos.dmg
            bundle_path: |
              PresenceJam-macos.dmg
              PresenceJam-${{ needs.resolve-tag.outputs.tag }}.app.tar.gz
              PresenceJam-${{ needs.resolve-tag.outputs.tag }}.app.tar.gz.sig
          - os: windows-latest
            target: ''
            artifact_name: PresenceJam-${{ needs.resolve-tag.outputs.tag }}.msi
            bundle_path: |
              PresenceJam-${{ needs.resolve-tag.outputs.tag }}.msi
              PresenceJam-${{ needs.resolve-tag.outputs.tag }}.msi.sig
          - os: ubuntu-latest
            target: ''
            artifact_name: PresenceJam-${{ needs.resolve-tag.outputs.tag }}-linux-amd64
            bundle_path: |
              PresenceJam-linux-amd64.deb
              PresenceJam-linux-amd64.AppImage
              PresenceJam-${{ needs.resolve-tag.outputs.tag }}.AppImage.sig

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Manual re-cut: check out the resolved tag's commit, not the
          # branch the workflow was dispatched from.
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # stable

      # Cargo cache mirrors the PR-time ci.yml setup (PR #55). Cuts the
      # release build from ~50 min cold compile to ~15-20 min warm.
      # First release on a fresh runner is still cold; subsequent
      # tag pushes benefit.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Setup Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      # Tauri on Linux pulls in glib-sys/webkit2gtk-sys/etc. via FFI
      # bindings, so the Ubuntu runner needs the GTK + webkit2gtk system
      # headers and pkg-config. Mirrors the pr-time ci.yml setup. The
      # Linux build produces both .deb (Debian package) and .AppImage
      # (universal single-file binary) in one `tauri build` invocation.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            build-essential

      - name: Build Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_INCREMENTAL: 0
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Debug macOS bundle
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Bundle directory structure ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f 2>/dev/null || echo "No files found"
          echo "=== DMG files ==="
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null || echo "No dmg found"

      - name: Package macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          dmg_path=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" 2>/dev/null | head -1)
          echo "Found dmg: $dmg_path"
          cp "$dmg_path" "PresenceJam-macos.dmg"

      # The updater plugin consumes the signed .app.tar.gz (+ .sig) from
      # the bundle; copy them to the deterministic release names so the
      # latest.json URLs are stable across versions.
      - name: Package macOS updater artifacts
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          TARGZ=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app.tar.gz" 2>/dev/null | head -1)
          SIG="${TARGZ}.sig"
          if [ -z "$TARGZ" ] || [ ! -f "$SIG" ]; then
            echo "::error::Expected .app.tar.gz and .sig in bundle/macos/"
            ls -la src-tauri/target/${{ matrix.target }}/release/bundle/macos/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$TARGZ" "PresenceJam-$RELEASE_TAG.app.tar.gz"
          cp "$SIG" "PresenceJam-$RELEASE_TAG.app.tar.gz.sig"
          echo "Packaged updater artifacts:"
          ls -la PresenceJam-$RELEASE_TAG.app.tar.gz*

      - name: Rename Windows MSI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "PresenceJam-$RELEASE_TAG.msi"

      # The MSI itself is the updater artifact; ship its .sig alongside
      # under the deterministic release name (the .msi is already renamed
      # above and uploaded via bundle_path).
      - name: Package Windows updater signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sig = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi.sig" | Select-Object -First 1
          if (-not $sig) {
            Write-Error "Expected .msi.sig in bundle/msi/"
            exit 1
          }
          Copy-Item $sig.FullName "PresenceJam-$RELEASE_TAG.msi.sig"
          Get-ChildItem "PresenceJam-$RELEASE_TAG.msi.sig"

      # Linux artifacts are named like `presence-jam_2.7.2_amd64.deb` by
      # Tauri's bundler. Rename to the project-standard format used by
      # the macOS and Windows steps (PresenceJam-<version>-<os>.ext) and
      # drop the .AppImage alongside.
      - name: Package Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$DEB" ] || [ -z "$APPIMAGE" ]; then
            echo "::error::Expected one .deb in bundle/deb/ and one .AppImage in bundle/appimage/"
            echo "bundle/deb/:"
            ls -la src-tauri/target/release/bundle/deb/ 2>&1 || echo "(missing)"
            echo "bundle/appimage/:"
            ls -la src-tauri/target/release/bundle/appimage/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$DEB" "PresenceJam-linux-amd64.deb"
          cp "$APPIMAGE" "PresenceJam-linux-amd64.AppImage"
          APPIMAGE_SIG="${APPIMAGE}.sig"
          if [ ! -f "$APPIMAGE_SIG" ]; then
            echo "::error::Expected .AppImage.sig in bundle/appimage/"
            ls -la src-tauri/target/release/bundle/appimage/ 2>&1 || echo "(missing)"
            exit 1
          fi
          cp "$APPIMAGE_SIG" "PresenceJam-$RELEASE_TAG.AppImage.sig"
          echo "Packaged:"
          ls -la PresenceJam-linux-amd64.* PresenceJam-$RELEASE_TAG.AppImage.sig

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
      # SLSA build provenance (candidate C10): emit a signed DSSE
      # attestation binding each packaged artifact to this exact
      # workflow run, verifiable downstream with
      # `gh attestation verify --repo Carme99/PresenceJam-Desktop`.
      # Supplements — does not replace — the minisign .sig files the
      # Tauri updater verifies. Needs id-token + attestations scopes,
      # granted to this job only (see the permissions block above).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ matrix.bundle_path }}

  release:
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          digest-mismatch: error

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          # Compute SHA-256 over every downloaded artifact file so the Release
          # carries a single SHA256SUMS.txt (uploaded by ncipollo via
          # artifacts/**/*). Format is one line per file: "<sha256>  <filename>".
          (cd artifacts && find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | awk '{gsub(/^\.\//,"",$2); n=split($2,a,"/"); print $1"  "a[n]}' | sort > SHA256SUMS.txt)
          echo "=== SHA256SUMS.txt ==="
          cat artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          artifacts: artifacts/**/*
          draft: false
          prerelease: false
          allowUpdates: true
          generateReleaseNotes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The updater plugin does no GitHub auto-discovery: it only reads
      # the endpoint configured in tauri.conf.json, so the release must
      # carry a latest.json that maps platform -> signed artifact URL.
      # Signatures are the .sig file CONTENTS (minisign output), not
      # paths; version = tag without the leading v; pub_date is RFC3339.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Downloaded artifacts keep the upload-artifact name as a
          # subdirectory under artifacts/ (download-artifact v4+ layout).
          MAC_SIG="artifacts/PresenceJam-${RELEASE_TAG}-macos.dmg/PresenceJam-${RELEASE_TAG}.app.tar.gz.sig"
          WIN_SIG="artifacts/PresenceJam-${RELEASE_TAG}.msi/PresenceJam-${RELEASE_TAG}.msi.sig"
          LINUX_SIG="artifacts/PresenceJam-${RELEASE_TAG}-linux-amd64/PresenceJam-${RELEASE_TAG}.AppImage.sig"

          for f in "$MAC_SIG" "$WIN_SIG" "$LINUX_SIG"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing updater signature file: $f"
              exit 1
            fi
          done

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${RELEASE_TAG}/PresenceJam-${RELEASE_TAG}.app.tar.gz" \
            --arg mac_sig "$(cat "$MAC_SIG")" \
            --arg win_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${RELEASE_TAG}/PresenceJam-${RELEASE_TAG}.msi" \
            --arg win_sig "$(cat "$WIN_SIG")" \
            --arg linux_url "https://github.com/Carme99/PresenceJam-Desktop/releases/download/${RELEASE_TAG}/PresenceJam-linux-amd64.AppImage" \
            --arg linux_sig "$(cat "$LINUX_SIG")" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "linux-x86_64": { url: $linux_url, signature: $linux_sig }
              }
            }' > latest.json
          echo "=== latest.json ==="
          cat latest.json
          gh release upload --clobber --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify latest.json assets in release
        run: |
          set -euo pipefail
          # Advisory option (a): derive/verify from actual published assets.
          # Fetch the asset list for this tag and ensure each URL basename
          # referenced in latest.json is present. A missing asset means the
          # updater would 404 (Tauri static JSON 404 silently means no-update).
          echo "Fetching asset list for ${RELEASE_TAG}..."
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].name' > /tmp/assets.txt
          echo "=== Release assets ==="
          cat /tmp/assets.txt
          for expected in "PresenceJam-${RELEASE_TAG}.app.tar.gz" "PresenceJam-${RELEASE_TAG}.msi" "PresenceJam-linux-amd64.AppImage"; do
            if ! grep -Fxq "$expected" /tmp/assets.txt; then
              echo "::error::Missing expected asset $expected in release ${RELEASE_TAG} — latest.json URL would 404"
              exit 1
            fi
            echo "Found expected asset: $expected"
          done
          echo "All expected updater assets verified"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Homebrew tap update (carme99/homebrew-tap)
  # ------------------------------------------------------------------
  # Runs after the GitHub Release is published so the DMG is available
  # at a stable URL. Pulls the artifact, computes its SHA256, and
  # updates the presence-jam formula in the tap.
  #
  # Required GitHub Actions secret (must be set in the repo's secrets
  # before the next v* tag push):
  #   HOMEBREW_TAP_TOKEN    classic PAT or fine-grained token with
  #                         contents:write on carme99/homebrew-tap.
  #                         (A fine-grained PAT scoped only to that
  #                         repo is the safer choice.)
  #
  # The job is self-bootstrapping: if presence-jam.rb doesn't exist
  # in the tap yet, it creates it. If it does, it updates version /
  # url / sha256. A no-op if the formula is already at the same
  # version (so re-running the workflow doesn't churn git history).
  homebrew:
    needs: [resolve-tag, release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      # Required so the homebrew/presence-jam.rb template is on the
      # runner. The release job already pushed the artifact to the
      # GitHub Release, but the source tree on the runner only
      # contains what was checked out at workflow-start.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: PresenceJam-${{ needs.resolve-tag.outputs.tag }}-macos.dmg
          path: dist/
          digest-mismatch: error

      - name: Compute SHA256 of the DMG
        working-directory: dist
        run: |
          set -euo pipefail
          if [ ! -f PresenceJam-macos.dmg ]; then
            echo "::error::PresenceJam-macos.dmg not found in artifact. Did the macOS build step succeed?"
            exit 1
          fi
          sha256sum PresenceJam-macos.dmg | tee sha256.txt
          echo "Computed SHA256 for $RELEASE_TAG"

      - name: Update Homebrew formula in carme99/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN must be set as a repository secret. See PR description for setup steps."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"  # strip leading 'v'
          DMG_URL="https://github.com/Carme99/PresenceJam-Desktop/releases/download/${RELEASE_TAG}/PresenceJam-macos.dmg"
          SHA=$(awk '{print $1}' dist/sha256.txt)
          echo "Updating tap formula to v${VERSION} (sha256=${SHA})"

          # Render the formula from the template in homebrew/presence-jam.rb
          # by substituting the placeholders. The template is checked in
          # so the formula content is reviewable in normal diffs and doesn't
          # live inside the workflow YAML.
          sed -e "s|__URL__|${DMG_URL}|g" \
              -e "s|__SHA256__|${SHA}|g" \
              -e "s|__VERSION__|${VERSION}|g" \
              homebrew/presence-jam.rb > presence-jam.rb.rendered

          # Shallow clone the tap without any credentials, then push via
          # a credential helper that hands the HOMEBREW_TAP_TOKEN to git
          # on demand. The token never appears in `git remote -v` output,
          # command lines, or shell history. Pattern from
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-secrets
          # SECURITY: HOMEBREW_TAP_TOKEN must be a fine-grained PAT scoped ONLY to
          # carme99/homebrew-tap with contents:write. A classic PAT gives full
          # access to every repo under the Carme99 GitHub account.
          # Rotate on a 90-day cadence. See docs: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
          git clone --depth 1 --branch main https://github.com/carme99/homebrew-tap.git tap
          cd tap
          # Configure a non-persistent credential helper that returns the token
          # only for pushes to the tap. The `!` prefix runs the command via
          # `sh -c`, so the token is sourced from the env, not interpolated.
          git config --local credential.helper '!f() { echo username=x-access-token; echo password=${HOMEBREW_TAP_TOKEN}; }; f'
          # Sanity-check the credential helper works before any commit/push.
          git ls-remote --heads origin main >/dev/null

          # If the formula is already at this version, nothing to do.
          if [ -f presence-jam.rb ]; then
            CURRENT_VERSION=$(grep -E '^  version ' presence-jam.rb | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ "${CURRENT_VERSION}" = "${VERSION}" ]; then
              echo "Formula is already at v${VERSION}, no change"
              exit 0
            fi
            echo "Formula currently at v${CURRENT_VERSION}, updating to v${VERSION}"
          else
            echo "Formula does not exist yet, creating it"
          fi

          cp ../presence-jam.rb.rendered presence-jam.rb
          git config user.name "Nova"
          git config user.email "nova@lee-lab.local"
          git add presence-jam.rb
          git commit -m "presence-jam: bump to v${VERSION}"
          git push origin main
          echo "Tap updated: carme99/homebrew-tap presence-jam.rb -> v${VERSION}"

  winget:
    needs: [resolve-tag, release]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # The winget-releaser action does not update open PRs — if a PR
      # already exists for this version, it silently skips. This is
      # a footgun: if the manifest becomes stale (e.g. the underlying
      # MSI was re-uploaded with a different filename), the broken
      # PR blocks the package from being re-submitted. The current
      # workaround when this happens: close the open PR, then push
      # a new tag (or force-move the existing tag) to re-fire this
      # job, which sees no open PR and creates a fresh one.
      #
      # TOKEN + FORK (issue #182): the action only supports CLASSIC
      # PATs (fine-grained not supported — see vedantmgoyal2009/
      # winget-releaser#172) and microsoft/winget-pkgs blocks direct
      # classic-token pushes (org restriction; GitHub API reports
      # push:false for this account). So WINGET_TOKEN must be a classic
      # PAT with `public_repo` AND `workflow` scopes, and the manifest is
      # submitted via the fork at Carme99/winget-pkgs (`fork-user`).
      # `workflow` scope is REQUIRED: komac sync-fork (and any fork
      # sync) merges upstream master, which updates .github/workflows/*
      # in the fork — GitHub refuses those ref updates without the
      # `workflow` scope (verified: 422 "refusing to allow a PAT to
      # create or update workflow ... without workflow scope"). The
      # action pushes the manifest branch to the fork and opens the PR
      # fork -> microsoft/winget-pkgs. Keep the
      # fork alive; komac syncs it with upstream before each run.
      # Rotate the PAT on a 90-day cadence.
      # See docs: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
      # HEAD after v2 (only tag is v2 = 4ffc7888): adds the `komac
      # sync-fork` step, which is REQUIRED for the fork path — komac
      # creates the manifest branch in the fork pointing at UPSTREAM
      # master; if the fork is behind (winget-pkgs master moves
      # constantly), createRef is FORBIDDEN with a misleading "does not
      # have the correct permissions" error (verified empirically).
      - uses: vedantmgoyal2009/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193
        with:
          identifier: PresenceJam.PresenceJam
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ needs.resolve-tag.outputs.tag }}
          fork-user: Carme99
