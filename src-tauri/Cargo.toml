[package]
name = "presence-jam"
version = "4.6.0"
description = "Syncs Spotify playback to Microsoft Teams status"
authors = ["Jack Lee"]
edition = "2021"
rust-version = "1.96"

[lib]
name = "presence_jam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "~2.4", features = ["deep-link"] }

# macOS-only CoreServices bindings used by `macos_deeplink.rs` to re-claim the
# `presencejam://` URL scheme at every launch (issue #66): on macOS
# `tauri-plugin-deep-link`'s `register_all()` returns `Err(UnsupportedPlatform)`
# because schemes are claimed through the app bundle's `CFBundleURLTypes`, and
# LaunchServices honours the first claimant. `LSSetDefaultHandlerForURLScheme`
# is the override. Both crates are already in the tree via tauri's own macOS
# dependencies, so this adds no new transitive weight.
[target."cfg(target_os = \"macos\")".dependencies]
# CFString, used to pass the scheme and bundle id to LaunchServices.
objc2-core-foundation = { version = "~0.3", default-features = false, features = ["std", "CFString"] }
# `LSInfo` carries `LSSetDefaultHandlerForURLScheme`; `LaunchServices` is the
# umbrella feature that re-exports the LaunchServices module.
objc2-core-services = { version = "~0.3", default-features = false, features = ["std", "LSInfo", "LaunchServices"] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-deep-link = "~2.4"
tauri-plugin-opener = "~2.5"
tauri-plugin-notification = "~2.4"
tauri-plugin-autostart = "~2.5"
tauri-plugin-log = "~2.9"
tauri-plugin-updater = "~2.11"
tauri-plugin-dialog = "~2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
httpdate = "1"
parking_lot = "0.12"
url = "2"
urlencoding = "2"
# Cross-platform OS keychain access for secure storage of OAuth secrets
# (e.g. Spotify client_secret). See issue #9.
# Kept features (issue #418): apple-native + windows-native, plus enabling
# both linux-native and sync-secret-service on Linux — with both enabled the
# persistent Secret Service store becomes the Linux default (see keyring
# src/lib.rs "Credential store features"; Secret Service persists via
# gnome-keyring/kwallet, configured in SETUP.md#linux-keyring). The
# keyutils-only store is in-memory and expires after logout/reboot, so it
# cannot hold OAuth secrets or the tokens AES key alone.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service"] }
# AES-256-GCM authenticated encryption for tokens.json at rest; the key is
# held in the OS keychain (see keychain::get_or_create_tokens_aes_key).
# See issue #140.
aes-gcm = "0.11.0"
# ts-rs generates TypeScript type declarations from Rust structs at
# `cargo test` time. The `#[ts(export)]` attribute emits a hidden `#[test]`
# that writes the .ts files; the explicit `#[cfg(test)] ts_rs_export` mod
# in each module also calls `TS::export_all()` so the files are produced
# deterministically and independently of the macro's auto-test.
# `chrono-impl` is required because `SpotifyTokens.expires_at` and
# `TeamsTokens.expires_at` are `chrono::DateTime<Utc>`. See issue #78.
ts-rs = { version = "12", features = ["chrono-impl"] }
