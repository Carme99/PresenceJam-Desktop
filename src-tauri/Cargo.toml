[package]
name = "presence-jam"
version = "4.7.0"
description = "Syncs Spotify playback to Microsoft Teams status"
authors = ["Jack Lee"]
# SPDX license for cargo-deny (issue #776): without this the workspace root
# falls through to LicenseInfo::Unlicensed (Severity::Error). Matches /LICENSE.
license = "MIT"
edition = "2021"
rust-version = "1.96"

[lib]
name = "presence_jam_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "~2.4", features = ["deep-link"] }

# macOS-only CoreServices bindings used by `macos_deeplink.rs` to re-claim the
# `presencejam://` URL scheme at every launch (issue #66): on macOS
# `tauri-plugin-deep-link`'s `register_all()` returns `Err(UnsupportedPlatform)`
# because schemes are claimed through the app bundle's `CFBundleURLTypes`, and
# LaunchServices honours the first claimant. `LSSetDefaultHandlerForURLScheme`
# is the override. Both crates are already in the tree via tauri's own macOS
# dependencies, so this adds no new transitive weight.
[target."cfg(target_os = \"macos\")".dependencies]
# CFString, used to pass the scheme and bundle id to LaunchServices.
objc2-core-foundation = { version = "~0.3", default-features = false, features = ["std", "CFString"] }
# `LSInfo` carries `LSSetDefaultHandlerForURLScheme`; `LaunchServices` is the
# umbrella feature that re-exports the LaunchServices module.
objc2-core-services = { version = "~0.3", default-features = false, features = ["std", "LSInfo", "LaunchServices"] }

# Windows-only platform APIs (issues #872, #873, #818):
# `SHQueryUserNotificationState` lives in `Win32_UI_Shell` (with its
# `HRESULT`/`BOOL` aliases through `Win32_Foundation`), and
# `platform::idle::WindowsIdleProbe` reuses the same crate. The CLI
# parent-console attach (`AttachConsole` + `CONOUT$` reopen in lib.rs,
# issue #818) needs `Win32_System_Console` + `Win32_Storage_FileSystem`
# (+ `Win32_Security`, which gates the `CreateFileW` overload upstream).
[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_Storage_FileSystem", "Media_Control", "Storage_Streams"] }
windows-collections = "0.3"

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-deep-link = "~2.4"
tauri-plugin-opener = "~2.5"
tauri-plugin-notification = "~2.4"
tauri-plugin-autostart = "~2.5"
tauri-plugin-log = "~2.9"
tauri-plugin-updater = "~2.11"
tauri-plugin-dialog = "~2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
httpdate = "1"
parking_lot = "0.12"
url = "2"
urlencoding = "2"
# Cross-platform OS keychain access for secure storage of OAuth secrets
# (e.g. Spotify client_secret). See issue #9.
# Kept features (issue #418): apple-native + windows-native, plus enabling
# both linux-native and sync-secret-service on Linux — with both enabled the
# persistent Secret Service store becomes the Linux default (see keyring
# src/lib.rs "Credential store features"; Secret Service persists via
# gnome-keyring/kwallet, configured in SETUP.md#linux-keyring). The
# keyutils-only store is in-memory and expires after logout/reboot, so it
# cannot hold OAuth secrets or the tokens AES key alone.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service"] }
# AES-256-GCM authenticated encryption for tokens.json at rest; the key is
# held in the OS keychain (see keychain::get_or_create_tokens_aes_key).
# See issue #140.
aes-gcm = "0.11.0"
# ts-rs generates TypeScript type declarations from Rust structs at
# `cargo test` time. The `#[ts(export)]` attribute emits a hidden `#[test]`
# in each source file that writes the .ts files into
# `src/lib/types-generated/`; CI's `cargo test --manifest-path
# src-tauri/Cargo.toml --lib` step materialises them so `npm run check`
# reads fresh re-exports from `src/lib/types.ts`.
# `chrono-impl` is required because `SpotifyTokens.expires_at` and
# `TeamsTokens.expires_at` are `chrono::DateTime<Utc>`. See issue #78.
ts-rs = { version = "12", features = ["chrono-impl"] }
tauri-plugin-global-shortcut = "~2.3"

# Issue #865: `--serve` is a token-guarded localhost HTTP control and event
# API. `tiny_http` is the smallest HTTP server that supports streaming
# chunked responses (the `/events` SSE endpoint) without dragging in a
# full async runtime on top of Tauri's; the daemon's serve thread uses it
# in blocking mode via `tauri::async_runtime::spawn_blocking`.
tiny_http = { version = "0.12", default-features = false }

# Issue #896: `--daemon` waits on SIGTERM/SIGINT so systemd, launchd and
# Task Scheduler can stop the daemon cleanly. `signal-hook`'s registry API
# gives us a sync handler that flips an `AtomicBool` the daemon loop
# polls — no async signal stack on top of the platform ones. Unix-only;
# on Windows the daemon stops via `taskkill` (see CHANGELOG.md).
[target."cfg(unix)".dependencies]
signal-hook = "0.3"

# Issue #862: the Linux `MprisSource` reads now-playing metadata from any
# audio app registered with the OS media-session bus (`org.mpris.MediaPlayer2.*`).
# `zbus` is the smallest pure-Rust D-Bus client. Tauri's `async_runtime`
# is tokio on every platform, so we use the tokio feature; the polling
# thread drives the read via `tauri::async_runtime::spawn_blocking` —
# same trade-off as `tiny_http` for the `--serve` slice.
[target."cfg(target_os = \"linux\")".dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Release profile (issue #899). Cargo builds release artefacts with 16 codegen
# units, no cross-crate LTO and a full symbol table by default, and every
# shipped artefact — MSI, NSIS setup, DMG, .app.tar.gz, deb, AppImage — paid
# for it. `thin` LTO keeps the compile in the same order of magnitude as the
# previous profile while still cutting across crates.
#
# `panic = "abort"` removes unwinding, so the crash path has to be checked:
# the panic hook in lib.rs logs `[PANIC] ...` through tauri-plugin-log, whose
# file target is a fern Output::writer — fern flushes the writer after every
# record (fern 0.7.1, writer_log_impl), and tauri-plugin-log's
# RotatingFile::flush writes the buffer to the file and flushes it. abort()
# skips destructors, not the hook, so the line still reaches the log file.
[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
