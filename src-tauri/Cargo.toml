[package]
name = "presence-jam"
version = "2.6.3"
description = "Syncs Spotify playback to Microsoft Teams status"
authors = ["Jack Lee"]
edition = "2021"

[lib]
name = "presence_jam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"
once_cell = "1"
url = "2"
urlencoding = "2"
# Cross-platform OS keychain access for secure storage of OAuth secrets
# (e.g. Spotify client_secret). See issue #9.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "linux-native"] }
