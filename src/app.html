<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PresenceJam</title>
    <!-- Issue #433: pre-paint theme so detached windows hydrate without a
      flash of the wrong theme. Reads the same `presencejam:theme` key the
      theme store persists (plus the `?theme=` override the opener appends)
      before SvelteKit paints. No dependencies, no imports — key literal
      duplicated deliberately so this file never couples to the store.
      CSP status (checked 2026-09-16): tauri.conf.json `security.csp` sets
      `default-src 'self'` with NO `script-src` directive, so this first-
      party inline script is allowed (script-src falls back to default-src
      and 'self' permits same-origin inline in the Tauri webview, which
      does not apply a separate HTML-spec inline ban). If a future CSP
      adds `script-src` without 'unsafe-inline', move this block to an
      external asset and re-verify detached hydration.
      Scope note (#434): this slice ships snapshot-copy ONLY — LogViewer
      virtualization/jump-to-latest already landed separately, no
      virtualization work here. -->
    <script>
      try {
        var __pjTheme = new URLSearchParams(location.search).get('theme');
        if (__pjTheme !== 'dark' && __pjTheme !== 'light') {
          __pjTheme = localStorage.getItem('presencejam:theme') || null;
        }
        if (__pjTheme !== 'dark' && __pjTheme !== 'light') {
          __pjTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', __pjTheme);
      } catch (e) { /* storage blocked — theme store applies its default */ }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
